<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SouthernLabs Challenge 🏆</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-container">
    <h1>SouthernLabs Challenge 🏆</h1>
    <p>Fill your details to start the game:</p>

    <form id="studentForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <select id="course" required>
        <option value="">Select Course</option>
        <option value="applied_software_development">Applied Software Development</option>
        <option value="software_engineering">Software Engineering</option>
      </select>
      <button type="submit">Start Challenge </button>
    </form>
  </div>

  <script>
    document.getElementById("studentForm").addEventListener("submit", function(e){
      e.preventDefault();
      sessionStorage.setItem("studentName", document.getElementById("name").value);
      sessionStorage.setItem("studentEmail", document.getElementById("email").value);
      sessionStorage.setItem("studentCourse", document.getElementById("course").value);
      sessionStorage.setItem("currentLevel","1");
      sessionStorage.setItem("startTime", Date.now());
      window.location.href = "game.html";
    });
  </script>
</body>
</html>
