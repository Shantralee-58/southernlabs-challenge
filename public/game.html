<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SouthernLabs Challenge Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>SouthernLabs Challenge 🚀</h1>
    <p id="studentInfo"></p>
    <p id="timer">Time left: 180 min</p>
    <p id="level-info">Level 1</p>
    <p id="instructions"></p>

    <div class="game-area">
      <div id="grid"></div>
      <div id="blocklyDiv" style="height: 400px; width: 400px;"></div>
    </div>

    <button id="runBtn">Run Code ▶️</button>
    <button id="submitBtn">Submit Level ✅</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
